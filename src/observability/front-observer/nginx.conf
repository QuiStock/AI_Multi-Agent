server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  location = /observe-health { return 200 'ok'; }
  location = /observe { return 308 /observe/; }
  location /observe/assets/ { try_files $uri =404; }
  location = /observe/index.html { add_header Cache-Control "no-store"; }
  location /observe/ { try_files $uri $uri/ /observe/index.html; }
  location / { return 404; }
}
