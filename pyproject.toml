[project]
name = "ai-multi-agent"
version = "0.0.1"
description = "An API providing LLMs and Machine Learning models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=2.0.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.0.0",
    "faiss-cpu>=1.9.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
addopts = "-ra -q -m 'not integration'"
testpaths = ["tests"]
pythonpath = ". src"
markers = [
    "integration: integration tests. normally depend on Docker Containers",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
exclude = ["tests/"]
