name: Publish chatbot image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check Infra token
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$INFRA_REPO_TOKEN" ]; then
            echo "Configure INFRA_REPO_TOKEN before publishing a release."
            exit 1
          fi

      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/quistock/ai-multi-agent:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/QuiStock/AI_Multi-Agent
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check out Infra repository
        uses: actions/checkout@v7
        with:
          repository: QuiStock/QuiStock-Infra
          ref: main
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Update desired image in Infra
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          digest = os.environ["IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"Unexpected image digest: {digest!r}")

          app_dir = Path("infra/clusters/expotech/apps/api-chatbot")
          image = f"ghcr.io/quistock/ai-multi-agent@{digest}"
          pattern = r"(?m)^([ \t]*image:[ \t]*)ghcr\.io/quistock/ai-multi-agent(?:[:@])[^\s]+$"
          for filename in ("deployment.yaml", "worker.yaml"):
              path = app_dir / filename
              manifest = path.read_text(encoding="utf-8")
              updated, count = re.subn(
                  pattern, lambda match: match.group(1) + image, manifest
              )
              if count != 1:
                  raise SystemExit(f"Expected one chatbot image in {path}, found {count}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Open deployment PR in Infra
        uses: peter-evans/create-pull-request@v8
        with:
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          add-paths: clusters/expotech/apps/api-chatbot/*.yaml
          base: main
          branch: deploy/api-chatbot-${{ github.event.release.tag_name }}
          delete-branch: true
          commit-message: "deploy(api-chatbot): ${{ github.event.release.tag_name }}"
          title: "deploy(api-chatbot): ${{ github.event.release.tag_name }}"
          body: |
            Atualiza a API Chatbot para a release [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }}).
            Imagem publicada: `ghcr.io/quistock/ai-multi-agent@${{ steps.image.outputs.digest }}`.

            O rolling update começa depois do merge desta PR, quando o Argo CD sincronizar o Infra.
