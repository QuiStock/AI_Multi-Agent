name: Container image (ARM64)

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - scripts/**
      - .github/workflows/container-arm64.yaml
      - .github/workflows/publish-image.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: quistock-chatbot:arm64-ci

      - name: Verify ARM64 architecture
        shell: bash
        run: test "$(docker image inspect --format '{{.Architecture}}' quistock-chatbot:arm64-ci)" = arm64

      - name: Verify API imports without credentials
        run: >-
          docker run --rm --platform linux/arm64 --entrypoint python
          quistock-chatbot:arm64-ci
          -c "from src.main import app; assert '/health' in app.openapi()['paths']"
